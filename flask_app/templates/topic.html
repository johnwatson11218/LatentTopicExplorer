<html>

<head>
    <title>Single Topic View</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/main.css') }}" />

</head>

<body>

    <div>
        <h1>Topic {{ id }} </h1>
    </div>
    <div>
        <h1>{{ topic_data[0].label }}</h1>
        <table>
            {% for document in topic_data %}
            <tr>
                <td> <a href="/document/{{ document.doc_id  }}">{{ document.document_titles }}</a></td>
            </tr>
            {% endfor %}
        </table>

    </div>

</body>

</html>
