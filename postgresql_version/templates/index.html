<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>


    <script lang="js">

        document.addEventListener( 'DOMContentLoaded', function(){

            const serverData = {{ serverData | safe }};
           Plotly.newPlot('chartDiv', [{
    x: serverData.x,
    y: serverData.y,
    mode: 'markers',
    type: 'scatter',
    text: serverData.labels,
    marker: {
        size: serverData.sizes,
        //opacity: 0.5,
        color: serverData.colors
    }
}], {
    autosize: true,
    margin: { l: 0, r: 0, t: 0, b: 0 },   // remove all margins
    paper_bgcolor: 'rgba(0,0,0,0)',        // transparent background
    plot_bgcolor: 'rgba(0,0,0,0)',
    xaxis: { visible: false },              // optional: hide axes for cleaner look
    yaxis: { visible: false },
    showlegend: false
}, {
    responsive: true,
    scrollZoom: true,        // explicitly enable wheel zoom
    displayModeBar: false                   // usually hide the toolbar for a background
});

            var plotDiv = document.getElementById('chartDiv');
            plotDiv.on('plotly_click', function (data) {

            // data.points contains an array of points clicked (usually one)
            if (data.points.length > 0) {
                var clickedPoint = data.points[0];
                if (!clickedPoint) return;

                var xValue = clickedPoint.x;
                if (!xValue) return;

                var yValue = clickedPoint.y;
                if (!yValue) return;

                var pointIndex = clickedPoint.pointIndex; // Index of the point in the data array


                window.location.href = '/document/' + serverData.ids[pointIndex];
            }
        });

        });
    </script>


    <style>
        #chart-bg {
    position: fixed;          /* or absolute if you prefer */
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;               /* sit behind everything */
     /* pointer-events: none;     let clicks pass through to content (remove if you still want plot interactivity) */
}

#chartDiv {
    width: 100%;
    height: 100%;
}

/* Make sure your content sits above the chart */
nav,
main.container {
    position: relative;
    z-index: 1;
}

/* Optional: dark semi-transparent overlay so text stays readable */
#chart-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(80, 73, 73, 0.15);  /* adjust strength */
    pointer-events: none;
}


.layout {
    display: grid;
    grid-template-columns: 340px 1fr;   /* wider sidebar */
    min-height: 100vh;
    position: relative;
    z-index: 1;
    pointer-events: none;              /* chart stays interactive */
}

.sidebar {
    pointer-events: auto;              /* sidebar itself is clickable */
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(10px);
    padding: 1.5rem;
    overflow-y: auto;
    border-right: 1px solid rgba(0,0,0,0.08);
    font-size: 1.05rem;                /* slightly larger text */
    line-height: 1.5;
}

.sidebar summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 0.4rem 0;
}

.sidebar details {
    margin-bottom: 0.75rem;
}

.sidebar ol {
    margin: 0.4rem 0 0.8rem 1.2rem;
    padding: 0;
}

.sidebar a {
    text-decoration: none;
}

.content {
    pointer-events: none;
}
    </style>



</head>
<body>

<!-- Full-bleed chart layer -->
    <div id="chart-bg">
        <div id="chartDiv"></div>
    </div>

<div class="layout">
    <aside class="sidebar">
        <details open>                          <!-- outer collapsible -->
            <summary>Topics & Documents</summary>

            {% for category in topics_and_documents %}
                <details>                       <!-- each category is also collapsible -->
                    <summary>
                        <a href="{{ url_for('topic', id=category.id) }}">
                            {{ category.label }}
                        </a>
                    </summary>
                    <ol>
                        {% for document in category.documents %}
                            <li>
                                <a href="{{ url_for('document', id=document.id) }}">
                                    {{ document.filename }}
                                </a>
                            </li>
                        {% endfor %}
                    </ol>
                </details>
            {% endfor %}
        </details>
    </aside>

    <main class="content">
        <!-- empty or light overlay content -->
    </main>
</div>
  
</body>
</html>
