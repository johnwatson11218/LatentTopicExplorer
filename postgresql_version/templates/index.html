<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

    <style>
        body {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);  /* fixed sidebar, flexible chart */
            height: 100vh;
            margin: 0;
            overflow: hidden;                             /* each column scrolls on its own */
        }

        .sidebar {
            overflow-y: auto;
            padding: 1.25rem;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .sidebar summary { cursor: pointer; font-weight: 600; padding: 0.3rem 0; }
        .sidebar details { margin-bottom: 0.5rem; }
        .sidebar ol { margin: 0.3rem 0 0.8rem 1.2rem; padding: 0; }
        .sidebar a { text-decoration: none; }

        #chartDiv { min-width: 0; height: 100%; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <details open>
            <summary>Topics &amp; Documents</summary>
            {% for category in topics_and_documents %}
                <details>
                    <summary>
                        <a href="{{ url_for('topic', id=category.id) }}">{{ category.label }}</a>
                    </summary>
                    <ol>
                        {% for document in category.documents %}
                            <li><a href="{{ url_for('document', id=document.id) }}">{{ document.filename }}</a></li>
                        {% endfor %}
                    </ol>
                </details>
            {% endfor %}
        </details>
    </aside>

    <div id="chartDiv"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const serverData = {{ serverData | safe }};

            Plotly.newPlot('chartDiv', [{
                x: serverData.x,
                y: serverData.y,
                mode: 'markers',
                type: 'scatter',
                text: serverData.labels,
                hoverinfo: 'text',
                marker: { size: serverData.sizes, color: serverData.colors }
            }], {
                autosize: true,
                margin: { l: 10, r: 10, t: 10, b: 10 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                xaxis: { visible: false },
                yaxis: { visible: false },
                showlegend: false,
                dragmode: 'pan'
            }, {
                responsive: true,
                scrollZoom: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['select2d', 'lasso2d']
            });

            document.getElementById('chartDiv').on('plotly_click', function (data) {
                const point = data.points[0];
                if (!point) return;
                window.location.href = '/document/' + serverData.ids[point.pointIndex];
            });
        });
    </script>

</body>
</html>
