<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css">
</head>
<html>

<body>



    <nav><a href="/">/Home</a> </nav>
    <main class="container">
        
        
            
            <p><a href="{{ url_for( 'document', id=document_id ) }}">Document</a></p>
            <p>page_number - {{ page_number }} </p>
            <p> page id {{ page_data[0] }} The top 5 nearest neighbors ... 
                
                {% for top1 in top5 %}
                    <a href="/page/{{ top1.document_id }}/{{ top1.page_number }}">Similar Page</a>
                {% endfor %}


            </p>
            <pre>{{ page_data[1] }}</pre>

            <p><a href='/page/{{document_id}}/{{ prev_page_number }}'>Previous Page</a></p>
            <p><a href='/page/{{document_id}}/{{ next_page_number }}'>Next Page</a></p>
    </main>

</body>

</html>
