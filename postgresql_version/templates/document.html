<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css">
</head>
<html>

<body>



    <nav><a href="/">/Home</a> </nav>
    <main class="container">
        <p>Topic - <a href="/topic/{{document_data[4] }}">{{ document_data[3] }}</a></p>
        <table>
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Filename</td>
                    <td>Size</td>
                    <td>Page Count</td>
                </tr>
            </thead>
            <tr>
                <td>{{ document_data[0] }}</td>
                <td><a href="/static/books/{{ document_data[1] }}">{{ document_data[1] }}</a></td>
                <td>{{ document_data[2] }}</td>
                <td>{{ document_data[5] }}</td>
            </tr>
        </table>
        <p>
            {% for i in range( 1, document_data[5]) %}
            <a href='/page/{{ document_data[0] }}/{{ i }}'>{{i}}</a>
            {% endfor %}
        </p>

    </main>

</body>

</html>
